<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chidole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0a0f;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: 'Courier New', monospace;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { position: relative; }
  #stage { position: relative; display: block; }
  canvas {
    display: block; border: 1px solid #1a1a2e; image-rendering: pixelated;
    cursor: url("assets/cursor.png") 0 0, auto;
  }
  canvas:active { cursor: url("assets/cursor_active.png") 0 0, auto; }
  #hud {
    display: flex; justify-content: space-between; align-items: center;
    color: #8af; font-size: 14px;
    padding: 4px 8px;
  }
  .bar { position: relative; display: inline-block; width: 96px; height: 12px; }
  .bar img {
    position: absolute; top: 0; left: 0; width: 96px; height: 12px;
    image-rendering: pixelated;
  }
  #hpFill, #xpFill { transform-origin: left center; }
  /* XP bar's track is precomposed (cap+stretched-middle+cap) at build time,
     so it's back to the same same-size back+fill pattern as the HP bars. */
  .xpbar { width: 90px; height: 32px; }
  .xpbar img.frame { width: 90px; height: 32px; }
  /* fill sits inside the track's actual inner channel (found by scanning the
     middle tile's banding), not the full cap height/width */
  #xpFill { left: 7px; top: 8px; width: 76px; height: 16px; }
  /* health bar floats directly above the player, who is always screen-centered */
  .healthbar.above-player {
    position: absolute; left: 50%; top: 50%;
    width: 32px; height: 5px;
    transform: translate(-50%, calc(-50% - 28px));
  }
  .healthbar.above-player img { width: 32px; height: 5px; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff;
    background: rgba(0,0,0,0.5); z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay .panel {
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 24px;
    border: 24px solid transparent;
    border-image: url("assets/panel.png") 30 fill / 24px / 0 repeat;
    image-rendering: pixelated;
  }
  #overlay h1 { font-size: 28px; color: #206; margin-bottom: 8px; letter-spacing: 4px; }
  #overlay p { font-size: 14px; color: #206; margin-bottom: 16px; text-align: center; padding: 0 16px; }
  #overlay .score-display { font-size: 24px; color: #a30; margin-bottom: 16px; }
  #weaponPicker { display: flex; gap: 12px; }
  #weaponPicker button {
    width: 76px; height: 76px; font-size: 11px; font-family: inherit;
    color: #fff; text-shadow: 1px 1px 2px #002;
    border: none; background: url("assets/button_normal.png") center / contain no-repeat;
    image-rendering: pixelated; cursor: pointer; letter-spacing: 1px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  #weaponPicker button img { width: 64px; height: 64px; image-rendering: pixelated; }
  #weaponPicker button:hover { background-image: url("assets/button_light.png"); }
  #weaponPicker button:active { background-image: url("assets/button_dark.png"); }
</style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>SCORE: <span id="score">0</span></span>
      <span>LV <span id="level">1</span></span>
      <span class="bar xpbar">
        <img src="assets/xpbar_back.png" class="frame" alt="">
        <img src="assets/xpbar_yellow.png" id="xpFill" alt="">
      </span>
    </div>
    <div id="stage">
      <canvas id="game"></canvas>
      <span class="bar healthbar above-player">
        <img src="assets/hpbar_back.png" alt="">
        <img src="assets/hpbar_green.png" id="hpFill" alt="">
      </span>
    </div>
    <div id="overlay">
      <div class="panel">
        <h1>CHIDOLE</h1>
        <p>Arrow keys / WASD, or click-and-hold toward a direction, to move — auto-fires at the nearest enemy. Choose a weapon to start:</p>
        <div id="weaponPicker">
          <button class="weapon-choice" data-weapon="1"><img src="assets/icon1.png" alt=""><span>Bullet</span></button>
          <button class="weapon-choice" data-weapon="3"><img src="assets/icon3.png" alt=""><span>Shotgun</span></button>
          <button class="weapon-choice" data-weapon="5"><img src="assets/icon5.png" alt=""><span>Blaster</span></button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
