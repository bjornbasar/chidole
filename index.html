<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chidole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0a0f;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: 'Courier New', monospace;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { position: relative; }
  canvas { display: block; border: 1px solid #1a1a2e; image-rendering: pixelated; }
  #hud {
    display: flex; justify-content: space-between; align-items: center;
    color: #8af; font-size: 14px;
    padding: 4px 8px;
  }
  .healthbar { position: relative; display: inline-block; width: 96px; height: 12px; }
  .healthbar img {
    position: absolute; top: 0; left: 0; width: 96px; height: 12px;
    image-rendering: pixelated;
  }
  #hpFill { transform-origin: left center; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff;
    background: rgba(0,0,0,0.5); z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay .panel {
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 24px;
    border: 24px solid transparent;
    border-image: url("assets/panel.png") 30 fill / 24px / 0 repeat;
    image-rendering: pixelated;
  }
  #overlay h1 { font-size: 28px; color: #206; margin-bottom: 8px; letter-spacing: 4px; }
  #overlay p { font-size: 14px; color: #206; margin-bottom: 16px; text-align: center; padding: 0 16px; }
  #overlay .score-display { font-size: 24px; color: #a30; margin-bottom: 16px; }
  #overlay button {
    width: 128px; height: 128px; font-size: 16px; font-family: inherit;
    color: #fff; text-shadow: 1px 1px 2px #002;
    border: none; background: url("assets/button_normal.png") center / contain no-repeat;
    image-rendering: pixelated; cursor: pointer; letter-spacing: 2px;
  }
  #overlay button:hover { background-image: url("assets/button_light.png"); }
  #overlay button:active { background-image: url("assets/button_dark.png"); }
</style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>SCORE: <span id="score">0</span></span>
      <span class="healthbar">
        <img src="assets/hpbar_back.png" alt="">
        <img src="assets/hpbar_red.png" id="hpFill" alt="">
      </span>
    </div>
    <canvas id="game"></canvas>
    <div id="overlay">
      <div class="panel">
        <h1>CHIDOLE</h1>
        <p>Arrow keys / WASD, or click-and-hold toward a direction, to move — auto-fires at the nearest enemy</p>
        <button id="startBtn">START</button>
      </div>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
