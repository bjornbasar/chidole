server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # No default Cache-Control meant browsers applied their own heuristic
  # caching to .js files and could serve a stale module indefinitely during
  # active dev. Force revalidation on every request instead.
  location ~ \.(js|html)$ {
    add_header Cache-Control "no-cache";
  }
}
